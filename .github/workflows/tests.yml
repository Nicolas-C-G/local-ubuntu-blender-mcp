name: Tests

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Blender add-on
        run: python -m py_compile blender_addon/blender_mcp_bridge/__init__.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
